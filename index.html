<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Form Monitoring RO - PT PNM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pnm-blue: #00529C;
      --pnm-blue-dark: #00386B;
      --pnm-green: #00A859;
      --pnm-green-light: #E6F6EC;
      --bg-gray: #F4F7FA;
      --text-dark: #2C3E50;
      --text-muted: #6C7A89;
      --border-color: #DCE3EC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 82, 156, 0.08);
      overflow: hidden;
      border: 1px solid rgba(0, 82, 156, 0.1);
    }

    .header {
      background: linear-gradient(135deg, var(--pnm-blue) 0%, var(--pnm-blue-dark) 100%);
      color: #FFFFFF;
      padding: 28px 24px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--pnm-green);
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .form-body {
      padding: 28px 24px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-group label span {
      color: #E74C3C;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
      background-color: #FAFCFE;
    }

    .form-control:focus {
      border-color: var(--pnm-blue);
      box-shadow: 0 0 0 3px rgba(0, 82, 156, 0.15);
      background-color: #FFFFFF;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    /* Tag Multi-Select Aktivitas */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background-color: #FAFCFE;
      min-height: 48px;
      align-items: center;
    }

    .tags-container:focus-within {
      border-color: var(--pnm-blue);
      box-shadow: 0 0 0 3px rgba(0, 82, 156, 0.15);
      background-color: #FFFFFF;
    }

    .tag-item {
      background: var(--pnm-green-light);
      color: var(--pnm-green);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(0, 168, 89, 0.2);
    }

    .tag-item .remove-btn {
      cursor: pointer;
      font-weight: bold;
      color: var(--pnm-green);
      font-size: 1rem;
      line-height: 1;
    }

    .tag-input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      min-width: 120px;
      padding: 4px;
      font-size: 0.9rem;
    }

    /* Custom File Input Upload */
    .file-upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #FAFCFE;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-upload-box:hover {
      border-color: var(--pnm-blue);
      background: #F0F5FA;
    }

    .file-upload-box input {
      display: none;
    }

    .file-upload-label {
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .file-upload-label strong {
      color: var(--pnm-blue);
    }

    .file-preview {
      margin-top: 10px;
      max-height: 180px;
      border-radius: 8px;
      display: none;
      object-fit: cover;
      width: 100%;
      border: 1px solid var(--border-color);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--pnm-green) 0%, #008F4C 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 168, 89, 0.25);
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background: #BDC3C7;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Status Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background-color: var(--pnm-green-light);
      color: var(--pnm-green);
      border: 1px solid rgba(0, 168, 89, 0.3);
    }

    .alert-error {
      background-color: #FDEDEC;
      color: #E74C3C;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>FORM MONITORING RO</h2>
      <p>PT Permodalan Nasional Madani</p>
    </div>

    <div class="form-body">
      <div id="alertBox" class="alert"></div>

      <form id="monitoringForm">
        <!-- 1. Tanggal -->
        <div class="form-group">
          <label for="tanggal">Tanggal Monitoring <span>*</span></label>
          <input type="date" id="tanggal" class="form-control" required>
        </div>

        <!-- 2. Unit Kerja (Suggest List Sheet DETAIL Kolom B) -->
        <div class="form-group">
          <label for="unitKerja">Unit Kerja <span>*</span></label>
          <input type="text" id="unitKerja" list="listUnitKerja" class="form-control" placeholder="Ketik / Pilih Unit Kerja..." autocomplete="off" required>
          <datalist id="listUnitKerja"></datalist>
        </div>

        <!-- 3. Aktivitas (Suggest List Sheet OPERATOR Kolom F + Multi Pilih/Kustom) -->
        <div class="form-group">
          <label for="aktivitasInput">Aktivitas <span>*</span> (Bisa Pilih Lebih Dari Satu / Ketik Baru)</label>
          <div class="tags-container" id="tagsContainer">
            <input type="text" id="aktivitasInput" class="tag-input" list="listAktivitas" placeholder="Ketik/Pilih & Tekan Enter..." autocomplete="off">
          </div>
          <datalist id="listAktivitas"></datalist>
        </div>

        <!-- 4. Temuan -->
        <div class="form-group">
          <label for="temuan">Deskripsi Temuan <span>*</span></label>
          <textarea id="temuan" class="form-control" placeholder="Tuliskan temuan atau hasil monitoring..." required></textarea>
        </div>

        <!-- 5. Upload Foto -->
        <div class="form-group">
          <label>Upload Foto Monitoring <span>*</span></label>
          <div class="file-upload-box" onclick="document.getElementById('fotoInput').click()">
            <div class="file-upload-label">
              <span>📷 <strong>Klik untuk pilih foto</strong> atau drag ke sini</span>
              <span id="fileNameDisplay" style="font-size: 0.8rem; color: var(--pnm-green);"></span>
            </div>
            <input type="file" id="fotoInput" accept="image/*" required onchange="handleFileSelect(event)">
          </div>
          <img id="imagePreview" class="file-preview" alt="Preview Foto">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">SIMPAN MONITORING</button>
      </form>
    </div>
  </div>

  <script>
    // DEPLOYMENT URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwPAA7Zs9lCHnut3GuvcrMcDzVRZw5TYVvDdUd-XtHuQqsfoessl2OWzmjzHxikmUsgZw/exec";

    let selectedAktivitas = [];
    let base64Foto = null;

    // Load initial data dari Sheet "DETAIL" dan "OPERATOR"
    window.addEventListener('DOMContentLoaded', () => {
      // Set default tanggal hari ini
      document.getElementById('tanggal').valueToDate = new Date();
      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

      fetchDataMaster();
    });

    function fetchDataMaster() {
      fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
          // Populate Unit Kerja dari Sheet DETAIL Kolom B (Index 1)
          if (data.detail && data.detail.length > 0) {
            const listUnit = document.getElementById('listUnitKerja');
            const unitSet = new Set();
            data.detail.forEach(row => {
              if (row[1]) unitSet.add(row[1]);
            });
            unitSet.forEach(unit => {
              const option = document.createElement('option');
              option.value = unit;
              listUnit.appendChild(option);
            });
          }

          // Populate Aktivitas dari Sheet OPERATOR Kolom F (Index 5)
          if (data.operator && data.operator.length > 0) {
            const listAktivitas = document.getElementById('listAktivitas');
            const aktivitasSet = new Set();
            data.operator.forEach(row => {
              if (row[5]) aktivitasSet.add(row[5]);
            });
            aktivitasSet.forEach(akt => {
              const option = document.createElement('option');
              option.value = akt;
              listAktivitas.appendChild(option);
            });
          }
        })
        .catch(err => console.error("Gagal mengambil data master:", err));
    }

    // Dynamic Multi-Select Aktivitas
    const aktivitasInput = document.getElementById('aktivitasInput');
    const tagsContainer = document.getElementById('tagsContainer');

    aktivitasInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addAktivitasTag(this.value.trim());
      }
    });

    aktivitasInput.addEventListener('change', function() {
      addAktivitasTag(this.value.trim());
    });

    function addAktivitasTag(val) {
      if (!val) return;
      if (!selectedAktivitas.includes(val)) {
        selectedAktivitas.push(val);
        renderTags();
      }
      aktivitasInput.value = '';
    }

    function removeAktivitasTag(val) {
      selectedAktivitas = selectedAktivitas.filter(item => item !== val);
      renderTags();
    }

    function renderTags() {
      // Clear tag-item lama
      const existingTags = tagsContainer.querySelectorAll('.tag-item');
      existingTags.forEach(tag => tag.remove());

      selectedAktivitas.forEach(val => {
        const tag = document.createElement('div');
        tag.className = 'tag-item';
        tag.innerHTML = `${val} <span class="remove-btn" onclick="removeAktivitasTag('${val}')">&times;</span>`;
        tagsContainer.insertBefore(tag, aktivitasInput);
      });
    }

    // Handle File Upload Preview & Base64
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').textContent = file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Foto = {
          name: file.name,
          base64: e.target.result
        };
        const imgPreview = document.getElementById('imagePreview');
        imgPreview.src = e.target.result;
        imgPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // Form Submit Handler
    document.getElementById('monitoringForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (selectedAktivitas.length === 0) {
        showAlert("Pilih atau ketik minimal satu Aktivitas!", "error");
        return;
      }

      if (!base64Foto) {
        showAlert("Silakan upload foto monitoring terlebih dahulu!", "error");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "SAVING DATA...";

      const payload = {
        action: "monitoring_ro",
        tanggalMonitoring: document.getElementById('tanggal').value,
        unitKerja: document.getElementById('unitKerja').value,
        aktivitas: selectedAktivitas.join(", "),
        temuan: document.getElementById('temuan').value,
        fotoMonitoring: base64Foto
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "SUCCESS") {
          showAlert("Data Monitoring RO Berhasil Disimpan!", "success");
          document.getElementById('monitoringForm').reset();
          selectedAktivitas = [];
          renderTags();
          document.getElementById('imagePreview').style.display = 'none';
          document.getElementById('fileNameDisplay').textContent = '';
          base64Foto = null;
        } else {
          showAlert("Gagal: " + res.message, "error");
        }
      })
      .catch(err => {
        showAlert("Terjadi kesalahan saat menyimpan data.", "error");
        console.error(err);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "SIMPAN MONITORING";
      });
    });

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert ${type === 'success' ? 'alert-success' : 'alert-error'}`;
      alertBox.style.display = 'block';
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
