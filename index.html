<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Form Monitoring RO - PT PNM</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --pnm-blue: #00529C;
      --pnm-blue-dark: #00386B;
      --pnm-green: #00A859;
      --pnm-green-light: #E6F6EC;
      --pnm-bg: #F4F7FA;
      --text-main: #2D3748;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--pnm-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 82, 156, 0.08);
      overflow: hidden;
      border: 1px solid rgba(0, 82, 156, 0.1);
    }

    /* Header Styling */
    .header {
      background: linear-gradient(135deg, var(--pnm-blue) 0%, var(--pnm-blue-dark) 100%);
      color: white;
      padding: 30px 25px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--pnm-green) 0%, #2ECC71 100%);
    }

    .header-logo-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .header i {
      font-size: 28px;
      color: #38EF7D;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.88;
      font-weight: 300;
    }

    /* Form Body */
    .form-body {
      padding: 30px 25px;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--pnm-blue-dark);
      margin-bottom: 8px;
    }

    .form-group label i {
      margin-right: 6px;
      color: var(--pnm-green);
    }

    .input-control {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-main);
      transition: all 0.3s ease;
      outline: none;
      background-color: #FAFAFA;
    }

    .input-control:focus {
      border-color: var(--pnm-blue);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(0, 82, 156, 0.1);
    }

    /* Suggestion List (Unit Kerja) */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: none;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .suggestion-item:hover {
      background-color: var(--pnm-green-light);
      color: var(--pnm-blue-dark);
      font-weight: 500;
    }

    /* Multi-select Badges & Custom Input (Aktivitas) */
    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tag {
      background: var(--pnm-green-light);
      color: var(--pnm-blue-dark);
      border: 1px solid rgba(0, 168, 89, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tag i {
      cursor: pointer;
      color: #E74C3C;
      transition: transform 0.2s;
    }

    .tag i:hover {
      transform: scale(1.2);
    }

    /* File Upload Area */
    .file-upload-box {
      border: 2px dashed var(--pnm-blue);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background-color: #F8FAFC;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-upload-box:hover {
      background-color: var(--pnm-green-light);
      border-color: var(--pnm-green);
    }

    .file-upload-box i {
      font-size: 32px;
      color: var(--pnm-blue);
      margin-bottom: 8px;
    }

    .file-upload-box p {
      font-size: 13px;
      color: #64748B;
    }

    .file-upload-box input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--pnm-blue) 0%, var(--pnm-green) 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(0, 168, 89, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 168, 89, 0.35);
    }

    .btn-submit:disabled {
      background: #CBD5E1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #FFFFFF;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Alert Message */
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background-color: var(--pnm-green-light);
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    .alert-error {
      background-color: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-logo-title">
        <i class="fa-solid fa-clipboard-check"></i>
        <h1>MONITORING RO</h1>
      </div>
      <p>PT Permodalan Nasional Madani</p>
    </div>

    <div class="form-body">
      <div id="alertBox" class="alert"></div>

      <form id="monitoringForm">
        
        <!-- 1. Isian Tanggal -->
        <div class="form-group">
          <label for="tanggal"><i class="fa-solid fa-calendar-day"></i> Tanggal Monitoring</label>
          <input type="date" id="tanggal" class="input-control" required>
        </div>

        <!-- 2. Unit Kerja (Suggest List Terdekat) -->
        <div class="form-group">
          <label for="unitKerjaInput"><i class="fa-solid fa-building"></i> Unit Kerja</label>
          <input type="text" id="unitKerjaInput" class="input-control" placeholder="Ketik nama unit kerja..." autocomplete="off" required>
          <div id="unitSuggestions" class="suggestions-list"></div>
        </div>

        <!-- 3. Aktivitas (Suggest List, Multi-Select & Custom) -->
        <div class="form-group">
          <label><i class="fa-solid fa-list-check"></i> Aktivitas (Bisa Pilih >1 atau Tambah Kustom)</label>
          <div id="selectedAktivitasTags" class="selected-tags"></div>
          <input type="text" id="aktivitasInput" class="input-control" placeholder="Pilih dari lis atau ketik aktivitas baru, tekan Enter..." autocomplete="off">
          <div id="aktivitasSuggestions" class="suggestions-list"></div>
        </div>

        <!-- 4. Isian Temuan / Deskripsi -->
        <div class="form-group">
          <label for="temuan"><i class="fa-solid fa-file-lines"></i> Temuan / Deskripsi</label>
          <textarea id="temuan" class="input-control" rows="4" placeholder="Tuliskan hasil temuan monitoring secara rinci..." required></textarea>
        </div>

        <!-- 5. Upload Foto Monitoring -->
        <div class="form-group">
          <label><i class="fa-solid fa-camera"></i> Upload Foto Monitoring</label>
          <div class="file-upload-box" onclick="document.getElementById('fotoInput').click()">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p id="uploadText">Klik di sini untuk mengambil / unggah foto</p>
            <input type="file" id="fotoInput" accept="image/*" required onchange="handleFileSelect(event)">
          </div>
          <img id="imagePreview" class="preview-img" alt="Preview Foto">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmit" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText"><i class="fa-solid fa-paper-plane"></i> Kirim Data Monitoring</span>
        </button>

      </form>
    </div>
  </div>

  <script>
    // ========================================================
    // TINGGAL UBAH DEPLOYMENT URL GOOGLE APPS SCRIPT DI SINI:
    // ========================================================
    const WEB_APP_URL = "DEPLOY_URL_HERES";

    // Master Data
    let listUnitKerja = [];
    let listAktivitas = [];
    let selectedAktivitas = [];
    let fotoBase64Data = null;

    // Inisialisasi
    document.addEventListener("DOMContentLoaded", function() {
      // Set Tanggal default ke Hari Ini
      document.getElementById('tanggal').valueAsDate = new Date();
      
      // Load Data Master dari Apps Script
      fetchMasterData();
    });

    // Fetch Data Master (Unit Kerja & Aktivitas)
    function fetchMasterData() {
      if (!WEB_APP_URL || WEB_APP_URL === "DEPLOY_URL_HERES") return;

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if (data.unitKerja) listUnitKerja = data.unitKerja;
          if (data.aktivitas) listAktivitas = data.aktivitas;
        })
        .catch(err => console.error("Gagal mengambil master data:", err));
    }

    // --- AUTOCOMPLETE UNIT KERJA ---
    const unitInput = document.getElementById('unitKerjaInput');
    const unitSuggestBox = document.getElementById('unitSuggestions');

    unitInput.addEventListener('input', function() {
      const val = this.value.toLowerCase().trim();
      unitSuggestBox.innerHTML = '';
      if (!val) {
        unitSuggestBox.style.display = 'none';
        return;
      }

      const matches = listUnitKerja.filter(item => item.toLowerCase().includes(val));
      if (matches.length > 0) {
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.textContent = item;
          div.onclick = function() {
            unitInput.value = item;
            unitSuggestBox.style.display = 'none';
          };
          unitSuggestBox.appendChild(div);
        });
        unitSuggestBox.style.display = 'block';
      } else {
        unitSuggestBox.style.display = 'none';
      }
    });

    // --- AKTIVITAS (SUGGEST, MULTI-SELECT & KUSTOM) ---
    const aktInput = document.getElementById('aktivitasInput');
    const aktSuggestBox = document.getElementById('aktivitasSuggestions');
    const tagsContainer = document.getElementById('selectedAktivitasTags');

    aktInput.addEventListener('input', function() {
      const val = this.value.toLowerCase().trim();
      aktSuggestBox.innerHTML = '';
      
      const matches = listAktivitas.filter(item => 
        item.toLowerCase().includes(val) && !selectedAktivitas.includes(item)
      );

      if (matches.length > 0) {
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.textContent = item;
          div.onclick = function() {
            addAktivitasTag(item);
            aktInput.value = '';
            aktSuggestBox.style.display = 'none';
          };
          aktSuggestBox.appendChild(div);
        });
        aktSuggestBox.style.display = 'block';
      } else {
        aktSuggestBox.style.display = 'none';
      }
    });

    aktInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = this.value.trim();
        if (val) {
          addAktivitasTag(val);
          this.value = '';
          aktSuggestBox.style.display = 'none';
        }
      }
    });

    function addAktivitasTag(text) {
      if (!selectedAktivitas.includes(text)) {
        selectedAktivitas.push(text);
        renderTags();
      }
    }

    function removeAktivitasTag(text) {
      selectedAktivitas = selectedAktivitas.filter(item => item !== text);
      renderTags();
    }

    function renderTags() {
      tagsContainer.innerHTML = '';
      selectedAktivitas.forEach(item => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerHTML = `${item} <i class="fa-solid fa-xmark" onclick="removeAktivitasTag('${item}')"></i>`;
        tagsContainer.appendChild(span);
      });
    }

    // Hide suggestion boxes when click outside
    document.addEventListener('click', function(e) {
      if (!unitInput.contains(e.target)) unitSuggestBox.style.display = 'none';
      if (!aktInput.contains(e.target)) aktSuggestBox.style.display = 'none';
    });

    // --- HANDLE FILE PHOTO UPLOAD & PREVIEW ---
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('uploadText').innerText = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
          fotoBase64Data = {
            name: file.name,
            base64: event.target.result
          };
          const preview = document.getElementById('imagePreview');
          preview.src = event.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    // --- FORM SUBMISSION ---
    document.getElementById('monitoringForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (selectedAktivitas.length === 0) {
        showAlert('Harap tambahkan minimal 1 Aktivitas!', 'error');
        return;
      }

      if (!fotoBase64Data) {
        showAlert('Harap unggah Foto Monitoring!', 'error');
        return;
      }

      const payload = {
        action: "MONITORING_RO",
        tanggal: document.getElementById('tanggal').value,
        unitKerja: document.getElementById('unitKerjaInput').value,
        aktivitas: selectedAktivitas,
        temuan: document.getElementById('temuan').value,
        fotoMonitoring: fotoBase64Data
      };

      setLoading(true);

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        setLoading(false);
        if (data.status === "SUCCESS") {
          showAlert(data.message, 'success');
          resetForm();
        } else {
          showAlert("Gagal: " + data.message, 'error');
        }
      })
      .catch(err => {
        setLoading(false);
        showAlert("Terjadi kesalahan jaringan/sistem: " + err.toString(), 'error');
      });
    });

    function setLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      const spinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      if (isLoading) {
        btn.disabled = true;
        spinner.style.display = 'inline-block';
        btnText.style.display = 'none';
      } else {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.style.display = 'inline-flex';
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type}`;
      box.textContent = msg;
      box.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('monitoringForm').reset();
      document.getElementById('tanggal').valueAsDate = new Date();
      selectedAktivitas = [];
      fotoBase64Data = null;
      renderTags();
      document.getElementById('uploadText').innerText = 'Klik di sini untuk mengambil / unggah foto';
      document.getElementById('imagePreview').style.display = 'none';
    }
  </script>
</body>
</html>
