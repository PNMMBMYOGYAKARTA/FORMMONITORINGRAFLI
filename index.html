<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Form Monitoring RO - PT PNM</title>
  
  <!-- Bootstrap 5 & Google Fonts & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --pnm-blue: #0A3254;
      --pnm-blue-accent: #0056B3;
      --pnm-green: #00A859;
      --pnm-green-hover: #008848;
      --pnm-bg: #F3F6FA;
      --pnm-card-bg: #FFFFFF;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--pnm-bg);
      color: #1E293B;
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    /* Header Banner */
    .pnm-header {
      background: linear-gradient(135deg, #0A3254 0%, #001E36 100%);
      color: #ffffff;
      padding: 3rem 1rem 4.5rem 1rem;
      border-bottom: 4px solid var(--pnm-green);
      position: relative;
      overflow: hidden;
    }

    .pnm-header::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: rgba(0, 168, 89, 0.1);
      border-radius: 50%;
      pointer-events: none;
    }

    .pnm-badge {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      color: #38BDF8;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Card Form Styles */
    .card-dashboard {
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(10, 50, 84, 0.08);
      background: var(--pnm-card-bg);
      margin-top: -2.5rem;
      transition: all 0.3s ease;
    }

    .form-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--pnm-blue);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-section-title::after {
      content: "";
      flex-grow: 1;
      height: 1px;
      background: var(--border-color);
      margin-left: 8px;
    }

    .form-label {
      font-weight: 600;
      color: #334155;
      font-size: 0.875rem;
      margin-bottom: 8px;
    }

    .form-label span {
      color: #E11D48;
    }

    .input-group-custom {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94A3B8;
      z-index: 10;
      font-size: 1rem;
      transition: color 0.2s ease;
    }

    .input-icon-textarea {
      position: absolute;
      left: 16px;
      top: 16px;
      color: #94A3B8;
      z-index: 10;
      font-size: 1rem;
    }

    .form-control-custom {
      border-radius: 12px;
      padding: 12px 16px 12px 46px;
      border: 1.5px solid var(--border-color);
      font-size: 0.95rem;
      font-weight: 500;
      background-color: #F8FAFC;
      transition: all 0.25s ease;
      width: 100%;
    }

    .form-control-custom:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: var(--pnm-blue-accent);
      box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.12);
    }

    .form-control-custom:focus + .input-icon {
      color: var(--pnm-blue-accent);
    }

    /* Tag Multi-Select Aktivitas */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      background-color: #F8FAFC;
      min-height: 50px;
      align-items: center;
      transition: all 0.25s ease;
    }

    .tags-container:focus-within {
      border-color: var(--pnm-blue-accent);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(0, 86, 179, 0.12);
    }

    .tag-item {
      background: #DCFCE7;
      color: var(--pnm-green-hover);
      font-weight: 600;
      font-size: 0.825rem;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(0, 168, 89, 0.2);
    }

    .tag-item .remove-btn {
      cursor: pointer;
      font-weight: bold;
      color: var(--pnm-green-hover);
      font-size: 1.1rem;
      line-height: 1;
    }

    .tag-input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      min-width: 140px;
      padding: 4px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1E293B;
    }

    /* Drag & Drop Upload Zone */
    .upload-card {
      border: 2px dashed #CBD5E1;
      border-radius: 16px;
      padding: 24px;
      background: #FAFCFF;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-card:hover {
      border-color: var(--pnm-green);
      background: #F0FDF4;
      transform: translateY(-2px);
    }

    .upload-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #E0F2FE;
      color: var(--pnm-blue-accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .upload-card:hover .upload-icon-wrapper {
      background: #DCFCE7;
      color: var(--pnm-green);
    }

    .upload-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1E293B;
      margin-bottom: 2px;
    }

    .upload-hint {
      font-size: 0.775rem;
      color: var(--text-muted);
    }

    .preview-container {
      position: relative;
      display: none;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
    }

    .preview-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    /* Button Styling */
    .btn-pnm {
      background: linear-gradient(135deg, var(--pnm-green) 0%, #008F4C 100%);
      color: #fff;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      box-shadow: 0 8px 20px rgba(0, 168, 89, 0.25);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .btn-pnm:hover {
      background: linear-gradient(135deg, #008F4C 0%, #00733D 100%);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 168, 89, 0.35);
    }

    .btn-pnm:active {
      transform: translateY(0);
    }

    .btn-pnm:disabled {
      background: #94A3B8;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <div class="pnm-header text-center">
    <div class="container">
      <span class="pnm-badge mb-2 d-inline-block">
        <i class="fa-solid fa-shield-halved me-1"></i> PT Permodalan Nasional Madani
      </span>
      <h2 class="fw-extrabold mb-1 tracking-tight">FORM MONITORING RO</h2>
      <p class="text-white-50 mb-0 small">Sistem Monitoring & Evaluasi Pelaksanaan Operasional RO</p>
    </div>
  </div>

  <!-- Form Container -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card card-dashboard p-4 p-md-5">

          <!-- Alert Output Message -->
          <div id="alertBox" class="alert mb-4" style="display: none;"></div>

          <form id="monitoringForm">
            
            <!-- Section 1: Informasi Pelaksanaan -->
            <div class="form-section-title">
              <i class="fa-solid fa-clipboard-list"></i> Informasi Monitoring
            </div>

            <div class="row g-3 mb-3">
              <!-- 1. Tanggal -->
              <div class="col-md-6">
                <label class="form-label" for="tanggal">Tanggal Monitoring <span>*</span></label>
                <div class="input-group-custom">
                  <i class="fa-solid fa-calendar-days input-icon"></i>
                  <input type="date" id="tanggal" class="form-control-custom" required>
                </div>
              </div>

              <!-- 2. Unit Kerja -->
              <div class="col-md-6">
                <label class="form-label" for="unitKerja">Unit Kerja / Cabang <span>*</span></label>
                <div class="input-group-custom">
                  <i class="fa-solid fa-building-user input-icon"></i>
                  <input type="text" id="unitKerja" list="listUnitKerja" class="form-control-custom" placeholder="Ketik / Pilih Unit Kerja..." autocomplete="off" required>
                </div>
                <datalist id="listUnitKerja"></datalist>
              </div>
            </div>

            <!-- 3. Aktivitas -->
            <div class="mb-3">
              <label class="form-label" for="aktivitasInput">Aktivitas <span>*</span> <small class="text-muted fw-normal">(Bisa Pilih Lebih Dari Satu / Ketik Baru)</small></label>
              <div class="tags-container" id="tagsContainer">
                <input type="text" id="aktivitasInput" class="tag-input" list="listAktivitas" placeholder="Ketik/Pilih & Tekan Enter..." autocomplete="off">
              </div>
              <datalist id="listAktivitas"></datalist>
            </div>

            <!-- 4. Temuan -->
            <div class="mb-4">
              <label class="form-label" for="temuan">Deskripsi Temuan <span>*</span></label>
              <div class="input-group-custom">
                <i class="fa-solid fa-file-pen input-icon-textarea"></i>
                <textarea id="temuan" class="form-control-custom" rows="4" style="padding-top: 12px; padding-left: 46px;" placeholder="Tuliskan temuan atau hasil monitoring..." required></textarea>
              </div>
            </div>

            <!-- Section 2: Upload Dokumentasi -->
            <div class="form-section-title mt-4">
              <i class="fa-solid fa-camera"></i> Dokumentasi Monitoring
            </div>

            <!-- 5. Upload Foto -->
            <div class="mb-4">
              <label class="form-label">Foto Bukti Monitoring <span>*</span></label>
              <div class="upload-card" onclick="document.getElementById('fotoInput').click()">
                <div class="upload-icon-wrapper">
                  <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div class="upload-title">Unggah Foto Monitoring</div>
                <div class="upload-hint">Klik atau drag foto di sini</div>
                <span id="fileNameDisplay" class="d-block mt-2 fw-semibold text-success small"></span>
                <input type="file" id="fotoInput" accept="image/*" class="d-none" required onchange="handleFileSelect(event)">
              </div>
              
              <div id="previewWrapper" class="preview-container">
                <img id="imagePreview" class="preview-image" alt="Preview Foto">
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="btn btn-pnm w-100 py-3 text-uppercase fs-6">
              <i class="fa-solid fa-floppy-disk me-2"></i> Simpan Data Monitoring
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script>
    // DEPLOYMENT URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwPAA7Zs9lCHnut3GuvcrMcDzVRZw5TYVvDdUd-XtHuQqsfoessl2OWzmjzHxikmUsgZw/exec";

    let selectedAktivitas = [];
    let base64Foto = null;

    // Load initial data dari Sheet "DETAIL" dan "OPERATOR"
    window.addEventListener('DOMContentLoaded', () => {
      // Set default tanggal hari ini
      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

      fetchDataMaster();
    });

    function fetchDataMaster() {
      fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
          // Populate Unit Kerja dari Sheet DETAIL Kolom B (Index 1)
          if (data.detail && data.detail.length > 0) {
            const listUnit = document.getElementById('listUnitKerja');
            const unitSet = new Set();
            data.detail.forEach(row => {
              if (row[1]) unitSet.add(row[1]);
            });
            unitSet.forEach(unit => {
              const option = document.createElement('option');
              option.value = unit;
              listUnit.appendChild(option);
            });
          }

          // Populate Aktivitas dari Sheet OPERATOR Kolom F (Index 5)
          if (data.operator && data.operator.length > 0) {
            const listAktivitas = document.getElementById('listAktivitas');
            const aktivitasSet = new Set();
            data.operator.forEach(row => {
              if (row[5]) aktivitasSet.add(row[5]);
            });
            aktivitasSet.forEach(akt => {
              const option = document.createElement('option');
              option.value = akt;
              listAktivitas.appendChild(option);
            });
          }
        })
        .catch(err => console.error("Gagal mengambil data master:", err));
    }

    // Dynamic Multi-Select Aktivitas
    const aktivitasInput = document.getElementById('aktivitasInput');
    const tagsContainer = document.getElementById('tagsContainer');

    aktivitasInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addAktivitasTag(this.value.trim());
      }
    });

    aktivitasInput.addEventListener('change', function() {
      addAktivitasTag(this.value.trim());
    });

    function addAktivitasTag(val) {
      if (!val) return;
      if (!selectedAktivitas.includes(val)) {
        selectedAktivitas.push(val);
        renderTags();
      }
      aktivitasInput.value = '';
    }

    function removeAktivitasTag(val) {
      selectedAktivitas = selectedAktivitas.filter(item => item !== val);
      renderTags();
    }

    function renderTags() {
      // Clear tag-item lama
      const existingTags = tagsContainer.querySelectorAll('.tag-item');
      existingTags.forEach(tag => tag.remove());

      selectedAktivitas.forEach(val => {
        const tag = document.createElement('div');
        tag.className = 'tag-item';
        tag.innerHTML = `${val} <span class="remove-btn" onclick="removeAktivitasTag('${val}')">&times;</span>`;
        tagsContainer.insertBefore(tag, aktivitasInput);
      });
    }

    // Handle File Upload Preview & Base64
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').textContent = file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Foto = {
          name: file.name,
          base64: e.target.result
        };
        const imgPreview = document.getElementById('imagePreview');
        const previewWrapper = document.getElementById('previewWrapper');
        imgPreview.src = e.target.result;
        previewWrapper.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // Form Submit Handler
    document.getElementById('monitoringForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (selectedAktivitas.length === 0) {
        showAlert("Pilih atau ketik minimal satu Aktivitas!", "error");
        return;
      }

      if (!base64Foto) {
        showAlert("Silakan upload foto monitoring terlebih dahulu!", "error");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Menyimpan Data...`;

      const payload = {
        action: "monitoring_ro",
        tanggalMonitoring: document.getElementById('tanggal').value,
        unitKerja: document.getElementById('unitKerja').value,
        aktivitas: selectedAktivitas.join(", "),
        temuan: document.getElementById('temuan').value,
        fotoMonitoring: base64Foto
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "SUCCESS") {
          showAlert("Data Monitoring RO Berhasil Disimpan!", "success");
          document.getElementById('monitoringForm').reset();
          selectedAktivitas = [];
          renderTags();
          document.getElementById('previewWrapper').style.display = 'none';
          document.getElementById('fileNameDisplay').textContent = '';
          base64Foto = null;
        } else {
          showAlert("Gagal: " + res.message, "error");
        }
      })
      .catch(err => {
        showAlert("Terjadi kesalahan saat menyimpan data.", "error");
        console.error(err);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk me-2"></i> Simpan Data Monitoring`;
      });
    });

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      const icon = type === 'success' ? 'fa-circle-check text-success' : 'fa-circle-xmark text-danger';
      const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
      
      alertBox.className = `alert ${alertClass} d-flex align-items-center rounded-3 shadow-sm border-0`;
      alertBox.innerHTML = `
        <i class="fa-solid ${icon} me-3 fs-3"></i>
        <div>
          <strong class="d-block">${type === 'success' ? 'Berhasil!' : 'Terjadi Kesalahan'}</strong>
          <span class="small">${message}</span>
        </div>`;
      
      alertBox.style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
